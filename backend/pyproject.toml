[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." puts the repo root on sys.path too, so a handful of backend tests
# that cross-check against ml/training (the "inference consistency" tests)
# can `import ml...` — see docs/ml-pipeline.md for why ml/ and backend/
# share one virtualenv in this project.
pythonpath = [".", ".."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

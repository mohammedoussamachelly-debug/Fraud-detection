[alembic]
script_location = alembic
prepend_sys_path = .

# Overridden at runtime by alembic/env.py from the ALEMBIC_DATABASE_URL
# environment variable (the admin/superuser connection used only for running
# migrations, distinct from the api_service runtime connection). This
# placeholder is never used as-is.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/sentinelai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
